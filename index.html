
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids-CSS</title>

    <style>
        body {
            margin: 0;
            background: white;
            display: grid;
            place-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
            width: 80%;
            max-width: 500px;
            padding: 35px;
            background-color: black;
            border-radius: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .container h1 {
            grid-column: span 4;
            color: white;
            text-align: center;
            font-size: 32px;
            margin: 0 0 10px;
        }

        .container .display {
            grid-column: span 4;
            background-color: #eeeeee;
            color: #222831;
            border-radius: 10px;
            padding: 25px;
            text-align: right;
            font-size: 35px;
            min-height: 45px;
            margin-bottom: 15px;
        }

        .container button {
            background-color: #393e46;
            border: none;
            border-radius: 10px;
            width: 100%;
            height: 70px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 0 #171a1e;
        }

        .container button:hover {
            background-color: #697586;
            transform: translateY(-4px);
            box-shadow: 0 7px 12px rgba(0, 0, 0, 0.3);
        }

        .container button:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .container button:last-child {
            background-color: #2563eb;
        }

        .container button:last-child:hover {
            background-color: #3b82f6;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>CALCULATOR</h1>

        <p class="display">0</p>

        <button>C</button>
        <button>(</button>
        <button>)</button>
        <button>/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>*</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>

        <button>0</button>
        <button>.</button>
        <button>%</button>
        <button>=</button>
    </div>

</body>
</html>
